# Minimal config so Supabase's GitHub integration (Branching) recognizes this
# repo and provisions preview databases from supabase/migrations/.
#
# Hand-written, not generated by `supabase init` — the Supabase CLI isn't
# installed in this environment and its login flow needs an interactive
# session (same OAuth limitation noted for the Supabase MCP server in
# docs/06-m1-handoff.md). Complete local CLI setup in an interactive session
# with `supabase login && supabase link --project-ref lobsbijgazlpurymxynd`;
# that will fill in whatever this file is missing rather than this being a
# guess at settings (auth redirect URLs, storage buckets, etc.) that are
# genuine product decisions, not inferrable from the schema alone.

project_id = "lobsbijgazlpurymxynd"

[db]
major_version = 17
