# Local development stack.
#
# Note: Postgres here is for local iteration only. The deployed target is
# Supabase — set DATABASE_URL to the Supabase *pooled* connection string and the
# api/worker services will use it instead.
#
# The benchmark (M0) needs none of this. `make bench` runs standalone.
#
# `n8n` is opt-in via a Compose profile (`docker compose --profile n8n up`) —
# plain `docker compose up` is unchanged. See README.md's "n8n edge workflows"
# section for what it's for and how to import the workflows once it's running.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arie
      POSTGRES_PASSWORD: arie_local_dev
      POSTGRES_DB: arie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arie"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies migrations/ via the canonical runner (scripts/migrate.py,
  # checksum-guarded schema_migrations — the ONLY path that writes schema, per
  # ADR 0005) and exits. api and worker gate on it having *completed*, not just
  # started, which is what fixes the clean-start crash where workers raced the
  # schema into existence ('relation "jobs" does not exist'). Idempotent by
  # construction, so restarting the stack re-runs it as a no-op.
  migrate:
    build: .
    command: python scripts/migrate.py
    environment:
      DATABASE_URL: postgresql://arie:arie_local_dev@db:5432/arie
      # Locally the "direct" and pooled connections are the same Postgres;
      # the distinction only matters against Supabase's pooler.
      DATABASE_DIRECT_URL: postgresql://arie:arie_local_dev@db:5432/arie
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: uvicorn arie.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://arie:arie_local_dev@db:5432/arie
      PROVIDER_MODE: simulated
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: python -m arie.jobs.worker
    environment:
      DATABASE_URL: postgresql://arie:arie_local_dev@db:5432/arie
      PROVIDER_MODE: simulated
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Workers are stateless and claim jobs via SKIP LOCKED, so this scales
    # horizontally with no coordination.
    deploy:
      replicas: 2

  # M1 Step 12 — the thin transport edge, not part of the default stack.
  # SQLite-backed (n8n's own zero-config default): a second Postgres database
  # just for n8n's internal state would be more infrastructure than three
  # demo workflows justify. N8N_SECURE_COOKIE=false is required for the auth
  # cookie to work over plain http:// on localhost; n8n refuses to set it
  # otherwise. Import workflows/n8n/*.json after this is up — see README.md.
  #
  # No ARIE_API_BASE_URL / MOCK_CRM_SINK_URL here on purpose: n8n blocks
  # `$env` access inside node expressions by default
  # (N8N_BLOCK_ENV_ACCESS_IN_NODE), found during manual end-to-end
  # verification when the env-var-based URLs silently resolved to nothing.
  # The workflow JSON hardcodes the two Docker-network service names instead
  # (`http://api:8000/...`, `http://n8n:5678/webhook/mock-crm-sink`) — both
  # are this Compose network's own DNS, not secrets, and stay correct as long
  # as the service names below don't change.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["n8n"]
    environment:
      N8N_SECURE_COOKIE: "false"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

volumes:
  pgdata:
  n8n_data:
