# Local development stack.
#
# Note: Postgres here is for local iteration only. The deployed target is
# Supabase — set DATABASE_URL to the Supabase *pooled* connection string and the
# api/worker services will use it instead.
#
# The benchmark (M0) needs none of this. `make bench` runs standalone.
#
# `n8n` is opt-in via a Compose profile (`docker compose --profile n8n up`) —
# plain `docker compose up` is unchanged. See README.md's "n8n edge workflows"
# section for what it's for and how to import the workflows once it's running.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arie
      POSTGRES_PASSWORD: arie_local_dev
      POSTGRES_DB: arie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arie"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn arie.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql://arie:arie_local_dev@db:5432/arie
      PROVIDER_MODE: simulated
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python -m arie.jobs.worker
    environment:
      DATABASE_URL: postgresql://arie:arie_local_dev@db:5432/arie
      PROVIDER_MODE: simulated
    depends_on:
      db:
        condition: service_healthy
    # Workers are stateless and claim jobs via SKIP LOCKED, so this scales
    # horizontally with no coordination.
    deploy:
      replicas: 2

  # M1 Step 12 — the thin transport edge, not part of the default stack.
  # SQLite-backed (n8n's own zero-config default): a second Postgres database
  # just for n8n's internal state would be more infrastructure than three
  # demo workflows justify. N8N_SECURE_COOKIE=false is required for the auth
  # cookie to work over plain http:// on localhost; n8n refuses to set it
  # otherwise. Import workflows/n8n/*.json after this is up — see README.md.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    profiles: ["n8n"]
    environment:
      N8N_SECURE_COOKIE: "false"
      ARIE_API_BASE_URL: http://api:8000
      MOCK_CRM_SINK_URL: http://localhost:5678/webhook/mock-crm-sink
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

volumes:
  pgdata:
  n8n_data:
