[project]
name = "arie"
version = "0.1.0"
description = "Adaptive Revenue Intelligence Engine — cost-aware active feature acquisition for lead qualification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core dependencies are deliberately minimal. Everything needed to run the
# benchmark (M0) is here; nothing in this list requires network access.
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",      # isotonic / Platt calibration
    "scipy>=1.13",            # exact binomial bounds for threshold selection
    "matplotlib>=3.8",        # frontier + reliability diagrams
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# M1 runtime — the service, not the proof.
service = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
]

[project.scripts]
arie-dataset = "arie.evalgen.cli:main"
arie-bench = "bench.run_benchmark:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true
# Third-party libs without stubs
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true

# numpy ships .pyi stubs using 3.12-only `type` statements, which mypy cannot
# parse on our 3.11 target. Following its imports aborts the whole run, so the
# stubs are skipped rather than the type checking weakened elsewhere.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live database (skipped by default in CI)",
    "slow: long-running benchmark tests",
]

[tool.coverage.run]
source = ["src/arie"]
omit = ["*/cli.py", "*/__init__.py"]
